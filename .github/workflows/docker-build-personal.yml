name: Docker Build and Push to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (e.g. v2.1.0, latest)'
        required: true
        default: 'personal-build'
        type: string

jobs:
  docker:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/personal-build'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag }}
          build-args: |
            TAG=${{ github.event.inputs.tag }}
